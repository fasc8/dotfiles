# Prefix

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# Ensure prefix is Ctrl+B
set -g prefix C-Space
set -g prefix2 C-b
# Send prefix to a nested tmux session by doubling the prefix
bind -N "Send prefix" C-Space send-prefix

# Config and help
# 'PREFIX q' to reload of the config file
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Use Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane horizontally" C-h split-window -v -c "#{pane_current_path}"
bind -N "Split pane vertically" C-v split-window -h -c "#{pane_current_path}"
bind -N "Split pane horizontally old style" '%' split-window -h -c '#{pane_current_path}'
bind -N "Split pane vertically old style" '"' split-window -v -c '#{pane_current_path}'
bind -N "Kill pane" x kill-pane

# Move around panes like in vim
bind -N "Focus pane left" -r h select-pane -L
bind -N "Focus pane right" -r l select-pane -R
bind -N "Focus pane up" -r k select-pane -U
bind -N "Focus pane down" -r j select-pane -D

bind-key -n M-f resize-pane -Z # Toggle full screen current pane
bind-key -n M-x setw synchronize-panes # Toggle sync panes

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

# Switch between previous and next windows with repeatable
bind -N "Previous window" -r n next-window
bind -N "Next window" -r p previous-window
bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Switch between two most recently used windows
bind -N "Toggle between last windows" Space last-window

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# General
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:RGB"

# Mouse mode
set -gq mouse on
set -gq mode-mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g history-limit 10000000
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10
set -g display-time 4000
set -g repeat-time 1000
set -g visual-bell off
set -g visual-activity off
set -g status-keys emacs
# Enable mouse for selecting and resizing
set -gq mouse-select-window on
set -gq mouse-select-pane on
set -gq mouse-resize-pane on

# Status bar
set -gq utf8 on
set -gq status-utf8 on
set -g allow-rename on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'
set -g display-panes-time 3000
set-window-option -g monitor-activity on

# Theme
set -g status-style "bg=default"
setw -g pane-active-border-style ''
set -g clock-mode-colour "#81a2be"
set -g clock-mode-style 24
set -g status-right-length 100
set -g status-right '#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,} #[fg=#f99157,bg=#2d2d2d] %H:%M |#[fg=#6699cc] %d.%m.%y '
set -g status-left "#[fg=#cccccc,bg=default] #S #[bg=default] "
set -g window-status-format '#[fg=#6699cc,bg=colour235] #I #[fg=#999999,bg=#2d2d2d] #W #[default]'
set -g window-status-current-format '#[fg=#f99157,bg=#2d2d2d] #I #[fg=#cccccc,bg=#393939] #W #[default]'

# Extensions
run-shell ~/Repos/tmux-prefix-highlight/prefix_highlight.tmux
